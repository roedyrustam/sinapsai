name: Auto Publish to NPM

on:
  push:
    branches:
      - main
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    name: Check & Publish to NPM
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install Dependencies
        run: npm ci

      - name: Run Tests
        run: npm test

      - name: Build Distribution Bundle
        run: npm run build

      - name: Check Version & Publish to NPM
        run: |
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          PUBLISHED_VERSION=$(npm view sinapsai version 2>/dev/null || echo "0.0.0")
          echo "Current package.json version: $CURRENT_VERSION"
          echo "Published npm registry version: $PUBLISHED_VERSION"

          if [ "$CURRENT_VERSION" != "$PUBLISHED_VERSION" ]; then
            echo "[Publish] New version detected ($CURRENT_VERSION != $PUBLISHED_VERSION). Publishing to NPM..."
            
            # Setup npm authentication (Supports both NPM_TOKEN secret and NPM Trusted Publishing OIDC)
            if [ -n "$NODE_AUTH_TOKEN" ]; then
              echo "[Auth] Using NODE_AUTH_TOKEN secret..."
              echo "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}" > ~/.npmrc
            else
              echo "[Auth] Using NPM OIDC Trusted Publishing..."
            fi

            # Publish with provenance
            npm publish --access public --provenance

            echo "[Success] Successfully published sinapsai@$CURRENT_VERSION to NPM!"

            # Create GitHub Release if not already created
            if ! gh release view "v$CURRENT_VERSION" >/dev/null 2>&1; then
              echo "[Release] Creating GitHub Release v$CURRENT_VERSION..."
              gh release create "v$CURRENT_VERSION" --title "v$CURRENT_VERSION" --generate-notes || true
            fi
          else
            echo "[Skip] Version $CURRENT_VERSION is already published on NPM ($PUBLISHED_VERSION). Nothing to publish."
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
