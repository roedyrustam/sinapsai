name: Auto Publish to NPM & GitHub Packages

on:
  push:
    branches:
      - main
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  packages: write

jobs:
  publish:
    name: Check & Publish to Registries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - name: Upgrade npm to latest for OIDC Trusted Publishing
        run: |
          npm install -g npm@latest
          npm --version

      - name: Install Dependencies
        run: npm ci

      - name: Run Tests
        run: npm test

      - name: Build Distribution Bundle
        run: npm run build

      - name: Publish to NPM Registry
        run: |
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          PUBLISHED_VERSION=$(npm view sinapsai version 2>/dev/null || echo "0.0.0")
          echo "Current package.json version: $CURRENT_VERSION"
          echo "Published npm registry version: $PUBLISHED_VERSION"

          if [ "$CURRENT_VERSION" != "$PUBLISHED_VERSION" ]; then
            echo "[NPM] Publishing sinapsai@$CURRENT_VERSION to NPM Registry via Trusted Publishing (OIDC)..."
            
            # Ensure no legacy auth token overrides OIDC Trusted Publishing
            sed -i '/_authToken/d' ~/.npmrc 2>/dev/null || true

            # Publish using GitHub Actions OIDC Trusted Publishing & Provenance
            npm publish --access public --provenance

            echo "[Success] Successfully published sinapsai@$CURRENT_VERSION to NPM Registry!"
          else
            echo "[Skip] Version $CURRENT_VERSION is already published on NPM Registry ($PUBLISHED_VERSION)."
          fi

      - name: Publish to GitHub Packages
        run: |
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          echo "[GitHub Packages] Preparing @roedyrustam/sinapsai@$CURRENT_VERSION for GitHub Packages..."

          # Scoped package name required by GitHub Packages
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.name = '@roedyrustam/sinapsai';
            pkg.repository = { type: 'git', url: 'https://github.com/roedyrustam/sinapsai.git' };
            pkg.publishConfig = { registry: 'https://npm.pkg.github.com' };
            if (pkg.scripts) delete pkg.scripts.prepublishOnly;
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2));
          "

          # Configure authentication for npm.pkg.github.com using GitHub Token in both userconfig and local .npmrc
          if [ -n "$NPM_CONFIG_USERCONFIG" ]; then
            echo "//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}" >> "$NPM_CONFIG_USERCONFIG"
            echo "@roedyrustam:registry=https://npm.pkg.github.com/" >> "$NPM_CONFIG_USERCONFIG"
          fi
          echo "//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}" > .npmrc
          echo "@roedyrustam:registry=https://npm.pkg.github.com/" >> .npmrc

          # Publish to GitHub Packages without re-running prepublish scripts
          npm publish --registry=https://npm.pkg.github.com/ --ignore-scripts --access public || echo "[Warning] GitHub Packages publish completed or version already exists."

          # Clean up local .npmrc and restore original package.json
          rm -f .npmrc
          git checkout package.json
          echo "[Success] GitHub Packages publication process complete!"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        run: |
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          if ! gh release view "v$CURRENT_VERSION" >/dev/null 2>&1; then
            echo "[Release] Creating GitHub Release v$CURRENT_VERSION..."
            gh release create "v$CURRENT_VERSION" --title "v$CURRENT_VERSION" --generate-notes || true
          else
            echo "[Release] GitHub Release v$CURRENT_VERSION already exists."
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
