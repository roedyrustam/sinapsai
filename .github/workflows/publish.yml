name: Auto Publish to NPM

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    name: Check & Publish to NPM
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v7
        with:
          node-version: 20.x
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Install Dependencies
        run: npm ci

      - name: Run Tests
        run: npm test

      - name: Build Distribution Bundle
        run: npm run build

      - name: Publish to NPM & Create GitHub Release if Version Bumped
        run: |
          if [ -n "$NODE_AUTH_TOKEN" ]; then
            echo "🔐 Menggunakan autentikasi NPM Token..."
            echo "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}" > ~/.npmrc
          else
            echo "🌐 Menggunakan autentikasi NPM Trusted Publishing (OIDC / Provenance)..."
          fi

          CURRENT_VERSION=$(node -p "require('./package.json').version")
          PUBLISHED_VERSION=$(npm view sinapsai version 2>/dev/null || echo "0.0.0")
          echo "Current package.json version: $CURRENT_VERSION"
          echo "Published npm registry version: $PUBLISHED_VERSION"

          if [ "$CURRENT_VERSION" != "$PUBLISHED_VERSION" ]; then
            echo "🚀 New version detected ($CURRENT_VERSION != $PUBLISHED_VERSION). Publishing to NPM..."
            npm publish --access public --provenance
            echo "✅ Successfully published sinapsai@$CURRENT_VERSION to NPM!"
          else
            echo "ℹ️ Version $CURRENT_VERSION is already published on NPM. Skipping publish."
          fi

          if ! gh release view "v$CURRENT_VERSION" >/dev/null 2>&1; then
            echo "🏷️ Creating GitHub Release v$CURRENT_VERSION..."
            gh release create "v$CURRENT_VERSION" --title "v$CURRENT_VERSION" --generate-notes || true
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}


